[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradelab-mt5"
version = "0.1.0"
description = "Multi-strategy quantitative forex research and MT5 demo-trading platform (demo only)."
requires-python = ">=3.11,<3.13"
# Lower bounds only; exact versions are pinned in requirements.lock.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Official MetaTrader 5 integration. Windows only; needs an installed MT5 terminal.
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
include = ["backend*", "strategy_library*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "real_mt5: requires a running MT5 terminal logged in to a demo account (skipped otherwise)",
]
